# The sign-in pages in the product's design (docs/design Login). The page layout (template.ftl) and the sign-in page
# (login.ftl) are our copies of keycloak.v2's; every other page keeps keycloak.v2's template and gets our styles.
# Texts: messages/ over Keycloak's own.
parent=keycloak.v2
import=common/keycloak

# css/styles.css is keycloak.v2's own; ours goes after it.
styles=css/styles.css css/backroom.css

# Links in the page footer (docs/design Login); each shows only when set to an https:// URL. Set them when the pages exist.
phPrivacyUrl=
phTermsUrl=
phDesktopUrl=
