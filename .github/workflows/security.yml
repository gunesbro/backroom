name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Scans the whole history of every fetched ref. gitleaks runs from its container image,
      # so no third-party action or license key is needed.
      - name: Scan history
        run: >
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --log-opts="--all"

  # Static analysis (SAST). GitHub code scanning (CodeQL) is not available for private repositories
  # on the free plan; Semgrep Community Edition covers C#, TypeScript, React, GitHub Actions,
  # package manager configuration and secrets. Any finding fails the job.
  semgrep:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Semgrep
        run: >
          docker run --rm -v "$PWD:/src:ro" -w /src
          semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
          semgrep scan --metrics=off --error
          --config p/default --config p/csharp --config p/typescript --config p/react
          --config p/github-actions --config p/secrets --config .semgrep
          --exclude '**/node_modules' --exclude '**/bin' --exclude '**/obj'
          --exclude '**/target' --exclude '**/dist'

  # The only check the branch ruleset requires for this workflow. Skipped jobs pass; failed or cancelled ones fail.
  security-required:
    needs: [gitleaks, semgrep]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
