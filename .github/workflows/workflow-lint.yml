name: Workflow lint

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"

permissions: {}

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests run every workflow so the gate job below always reports; this job decides whether the
  # heavy jobs have anything to check (same files as the push path filter). Pushes and manual runs check everything.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pull requests are checked out as a merge commit: its first parent is the base branch. Any error means relevant.
          files=$(git diff --no-renames --name-only HEAD^1 HEAD) || { echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if grep -qE '^\.github/workflows/' <<<"$files"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  actionlint:
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint also runs shellcheck on run: scripts. Container image pinned by version.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -no-color

  # The only check the branch ruleset requires for this workflow. Skipped jobs pass; failed or cancelled ones fail.
  workflow-lint-required:
    needs: [changes, actionlint]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
