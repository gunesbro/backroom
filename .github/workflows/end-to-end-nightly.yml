name: End-to-end (nightly)

# The whole end-to-end set: the control plane and two cells started by the AppHost in an isolated run, with every Phase 1
# flow including the invitation email (docs/requirements.md, "Test stratejisi"). Pull requests run the short set in
# backend.yml.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: end-to-end-nightly
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  end-to-end:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Restore only: caches are saved by backend.yml on main.
      - name: Restore NuGet packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'backend/Directory.Packages.props', 'backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore Aspire bundle
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.aspire
          key: aspire-${{ runner.os }}-${{ hashFiles('backend/src/Aspire/Backroom.AppHost/Backroom.AppHost.csproj') }}

      - name: Restore
        run: dotnet restore backend/tests/Backroom.EndToEndTests

      - name: Build
        run: dotnet build backend/tests/Backroom.EndToEndTests --no-restore --configuration Release

      # The worker reaches the control plane over HTTPS (gRPC) with the development certificate. On Linux, .NET trusts it
      # through OpenSSL's SSL_CERT_DIR, which dotnet dev-certs reads while it runs (so it is set on this step) and the
      # later steps need too (so it is exported).
      - name: Trust the development certificate
        env:
          SSL_CERT_DIR: /home/runner/.aspnet/dev-certs/trust:/usr/lib/ssl/certs
        run: |
          # Exit code 4 means partial trust: OpenSSL trusts it, but the browsers' NSS stores could not be updated, which
          # the tests do not use. Every other non-zero code fails the step.
          status=0
          dotnet dev-certs https --trust || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 4 ]; then
            exit "$status"
          fi
          # Check that OpenSSL (and so .NET) now validates the certificate from the trusted folder; TLS validation stays on.
          cert_dir="$(mktemp -d)"
          dotnet dev-certs https --export-path "$cert_dir/dev-cert.pem" --format PEM --no-password
          openssl verify -CApath /home/runner/.aspnet/dev-certs/trust "$cert_dir/dev-cert.pem"
          rm -rf "$cert_dir"
          echo "SSL_CERT_DIR=$SSL_CERT_DIR" >> "$GITHUB_ENV"

      - name: End-to-end tests (all)
        env:
          BACKROOM_E2E: "true"
        timeout-minutes: 20
        run: dotnet test --project backend/tests/Backroom.EndToEndTests --no-build --configuration Release
